# ==============================================================================
# SentinelAgent - Dedicated Hindsight API Ingress Proxy Configuration
# ==============================================================================
# Architecture Contract: Option B (Task 9G.7B.4 Strict Canonical Policy)
# Security Profile: Read-Only Root Filesystem, Unprivileged (UID 101), CapDrop ALL
# Upstream: sentinelagent-hindsight:8888 (Internal API Network Only)
# Ingress: 127.0.0.1:8888 (Host Loopback via Normal Bridge)
# ==============================================================================

pid /tmp/nginx.pid;
worker_processes 1;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Temp directories for unprivileged execution under read-only root fs
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Logging format:
    # Strictly omits $http_authorization, request/response bodies, query parameters,
    # client-supplied $http_referer, and $http_user_agent to preserve confidentiality.
    log_format safe_ingress '$remote_addr - $remote_user [$time_local] "$request_method $uri" $status $body_bytes_sent upstream: $upstream_addr rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time';
    access_log /dev/stdout safe_ingress;

    # TCP and Buffer Settings
    sendfile off;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    # Request Size Limits:
    # 16m ceiling accommodates max batch outbox retention (~1 MB actual max) with safety margin.
    client_max_body_size 16m;
    client_body_buffer_size 128k;

    # Docker Embedded DNS Resolver for dynamic container recreation
    # 127.0.0.11 is the Docker engine DNS daemon
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 8888;
        server_name _;

        # Dynamic upstream resolution variable
        # Resolves via 127.0.0.11 across the internal sentinelagent-api-net bridge
        set $hindsight_upstream "http://sentinelagent-hindsight:8888";

        # ----------------------------------------------------------------------
        # Security Gate: Strict Raw Request-Path Canonicalization
        # Evaluates the raw path component of $request_uri (preceding any '?').
        # Explicitly rejects with HTTP 400:
        #   - ANY percent-encoded character in the path (e.g. %62, %74, %2d, %5F, %7e, %41, %2e, %2f, %25)
        #   - Duplicate consecutive slashes (//)
        #   - Raw backslashes (\)
        #   - Dot-dot directory traversals (..) or dot segments (/.)
        #   - Trailing dots (.$ or .?)
        # ----------------------------------------------------------------------
        if ($request_uri ~ "^[^?]*?(?:%|//|\\\\|\.\.|/\.|\.$|\.\?)") {
            return 400 '{"error":"Bad Request: noncanonical request URI detected"}\n';
        }

        # ----------------------------------------------------------------------
        # 1. Local Gateway Health Check Endpoint
        # Probes ONLY the local Nginx ingress proxy container liveness.
        # NOTE: A 200 response here DOES NOT prove Hindsight upstream reachability.
        # Explicitly restricts method to GET only (rejects HEAD, POST, etc. with 405).
        # ----------------------------------------------------------------------
        location = /healthz {
            if ($request_method != GET) {
                return 405 '{"error":"Method Not Allowed"}\n';
            }
            return 200 '{"status":"healthy","gateway":"sentinelagent-hindsight-gw"}\n';
            add_header Content-Type application/json always;
        }

        # ----------------------------------------------------------------------
        # 2. Administrative, Discovery, and Spec Endpoints Denial
        # Explicitly return 404 to block reconnaissance, spec leakage, and disabled protocols.
        # Evaluated before regex allowlists to prevent any bypass.
        # ----------------------------------------------------------------------
        location ~ ^/(?:docs|redoc|openapi\.json|metrics|mcp|sse|version|v1/version)(?:/|$) {
            return 404 '{"error":"Not Found"}\n';
            add_header Content-Type application/json always;
        }

        # ----------------------------------------------------------------------
        # 3. Upstream Health Check Endpoints
        # Probes actual Hindsight application daemon and database connectivity.
        # Permitted methods: GET, HEAD (standard HTTP probe behavior).
        # Query parameters are strictly prohibited.
        # ----------------------------------------------------------------------
        location ~ ^/health(?:/(?:ready|live))?$ {
            limit_except GET HEAD {
                deny all;
            }

            if ($args != "") {
                return 400 '{"error":"Bad Request: query parameters not permitted on health endpoints"}\n';
            }

            proxy_pass $hindsight_upstream$uri$is_args$args;
            proxy_http_version 1.1;

            proxy_set_header Host sentinelagent-hindsight:8888;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;

            proxy_connect_timeout 5s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
            proxy_buffering off;
        }

        # ----------------------------------------------------------------------
        # 4. Bank Enumeration & Readiness Check Endpoint
        # Used by HindsightClientService.check_health() (GET /v1/default/banks?limit=1).
        # Permitted methods: GET only (HEAD explicitly rejected with 405).
        # Query parameters: optional limit=\d+ only (duplicate / unexpected rejected with 400).
        # ----------------------------------------------------------------------
        location = /v1/default/banks {
            limit_except GET {
                deny all;
            }

            if ($request_method = HEAD) {
                return 405 '{"error":"Method Not Allowed"}\n';
            }

            if ($args !~ ^(|limit=[0-9]+)$) {
                return 400 '{"error":"Bad Request: unsupported or malformed query parameters"}\n';
            }

            proxy_pass $hindsight_upstream$uri$is_args$args;
            proxy_http_version 1.1;

            proxy_set_header Host sentinelagent-hindsight:8888;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_buffering off;
        }

        # ----------------------------------------------------------------------
        # 5. Incident Memory Retention Endpoint
        # Used by HindsightClientService.retain_investigation_memory() (POST .../memories).
        # Permitted methods: POST only.
        # Query parameters: strictly prohibited (rejected with 400).
        # ----------------------------------------------------------------------
        location ~ ^/v1/default/banks/[a-zA-Z0-9_-]+/memories$ {
            limit_except POST {
                deny all;
            }

            if ($args != "") {
                return 400 '{"error":"Bad Request: query parameters not permitted on this endpoint"}\n';
            }

            proxy_pass $hindsight_upstream$uri$is_args$args;
            proxy_http_version 1.1;

            proxy_set_header Host sentinelagent-hindsight:8888;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering off;
        }

        # ----------------------------------------------------------------------
        # 6. Incident Memory Semantic Recall Endpoint
        # Used by HindsightClientService.recall_memories() (POST .../memories/recall).
        # Permitted methods: POST only.
        # Query parameters: strictly prohibited (rejected with 400).
        # ----------------------------------------------------------------------
        location ~ ^/v1/default/banks/[a-zA-Z0-9_-]+/memories/recall$ {
            limit_except POST {
                deny all;
            }

            if ($args != "") {
                return 400 '{"error":"Bad Request: query parameters not permitted on this endpoint"}\n';
            }

            proxy_pass $hindsight_upstream$uri$is_args$args;
            proxy_http_version 1.1;

            proxy_set_header Host sentinelagent-hindsight:8888;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_buffering off;
        }

        # ----------------------------------------------------------------------
        # 7. Asynchronous Operation Status Polling Endpoint
        # Used by HindsightClientService.get_operation_status() (GET .../operations/{id}).
        # Permitted methods: GET only (HEAD explicitly rejected with 405).
        # Query parameters: optional include_payload=(true|false|0|1) only.
        # ----------------------------------------------------------------------
        location ~ ^/v1/default/banks/[a-zA-Z0-9_-]+/operations/[a-zA-Z0-9_-]+$ {
            limit_except GET {
                deny all;
            }

            if ($request_method = HEAD) {
                return 405 '{"error":"Method Not Allowed"}\n';
            }

            if ($args !~ ^(|include_payload=(?:true|false|0|1))$) {
                return 400 '{"error":"Bad Request: unsupported or malformed query parameters"}\n';
            }

            proxy_pass $hindsight_upstream$uri$is_args$args;
            proxy_http_version 1.1;

            proxy_set_header Host sentinelagent-hindsight:8888;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;

            proxy_connect_timeout 5s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
            proxy_buffering off;
        }

        # ----------------------------------------------------------------------
        # 8. Asynchronous Operation Retry Submission Endpoint
        # Used by HindsightClientService.retry_operation() (POST .../operations/{id}/retry).
        # Permitted methods: POST only.
        # Query parameters: strictly prohibited (rejected with 400).
        # ----------------------------------------------------------------------
        location ~ ^/v1/default/banks/[a-zA-Z0-9_-]+/operations/[a-zA-Z0-9_-]+/retry$ {
            limit_except POST {
                deny all;
            }

            if ($args != "") {
                return 400 '{"error":"Bad Request: query parameters not permitted on this endpoint"}\n';
            }

            proxy_pass $hindsight_upstream$uri$is_args$args;
            proxy_http_version 1.1;

            proxy_set_header Host sentinelagent-hindsight:8888;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;

            proxy_connect_timeout 5s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
            proxy_buffering off;
        }

        # ----------------------------------------------------------------------
        # 9. Default Deny Policy
        # All other paths, unapproved tenant prefixes, methods, and protocols blocked.
        # Explicitly blocks DELETE, PUT, PATCH, bare /v1/banks, documents, and config.
        # ----------------------------------------------------------------------
        location / {
            return 403 '{"error":"Forbidden: endpoint not authorized under least-privilege ingress policy"}\n';
            add_header Content-Type application/json always;
        }
    }
}
