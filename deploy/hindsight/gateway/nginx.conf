# ==============================================================================
# SentinelAgent - Restricted Ollama Reverse-Proxy Gateway Configuration
# ==============================================================================
# Architecture Contract: Option B (Task 9F.7)
# Security Profile: Read-Only Root Filesystem, Unprivileged (UID 101), CapDrop ALL
# Upstream: sentinelagent-ollama:11434 (Internal Network Only)
# ==============================================================================

pid /tmp/nginx.pid;
worker_processes 1;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Temp directories for unprivileged execution under read-only root fs
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Logging format and output to stdout
    log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" upstream: $upstream_addr rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time';
    access_log /dev/stdout main;

    # TCP and Buffer Settings
    sendfile off;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    # Request Size Limits (support large prompt context payloads)
    client_max_body_size 64m;
    client_body_buffer_size 128k;

    # Docker Embedded DNS Resolver for dynamic container recreation
    # 127.0.0.11 is the Docker engine DNS daemon
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 11434;
        server_name _;

        # Dynamic upstream resolution variable
        # Resolves via 127.0.0.11 to handle container IP address changes across restarts
        set $ollama_upstream "http://sentinelagent-ollama:11434";

        # ----------------------------------------------------------------------
        # Primary Hindsight Endpoint: POST /api/chat
        # Used for LLM generation, retain synthesis, recall evaluation,
        # and startup connection verification (verify_connection)
        # ----------------------------------------------------------------------
        location = /api/chat {
            limit_except POST {
                deny all;
            }

            proxy_pass $ollama_upstream$request_uri;
            proxy_http_version 1.1;

            proxy_set_header Host sentinelagent-ollama:11434;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }

        # ----------------------------------------------------------------------
        # Conditional Fallback Route: POST /v1/chat/completions
        # Used if ollama_num_ctx is omitted or OpenAI compatibility is invoked
        # ----------------------------------------------------------------------
        location = /v1/chat/completions {
            limit_except POST {
                deny all;
            }

            proxy_pass $ollama_upstream$request_uri;
            proxy_http_version 1.1;

            proxy_set_header Host sentinelagent-ollama:11434;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }

        # ----------------------------------------------------------------------
        # Gateway Local Health Check Endpoint
        # ----------------------------------------------------------------------
        location = /healthz {
            limit_except GET {
                deny all;
            }
            return 200 '{"status":"healthy","gateway":"sentinelagent-ollama-gw"}\n';
            add_header Content-Type application/json always;
        }

        # ----------------------------------------------------------------------
        # Default Deny: All other paths, administrative endpoints, and verbs
        # Explicitly blocks:
        #   - /api/pull (model ingestion)
        #   - /api/delete (model deletion)
        #   - /api/create (model creation)
        #   - /api/push (model publishing)
        #   - /api/generate (raw completions)
        #   - /api/embeddings & /api/embed (embeddings handled locally in Hindsight)
        #   - /api/tags & /v1/models (catalog listing)
        #   - Arbitrary CONNECT proxying
        # ----------------------------------------------------------------------
        location / {
            return 403 '{"error":"Forbidden: endpoint not authorized under least-privilege gateway policy"}\n';
            add_header Content-Type application/json always;
        }
    }
}
